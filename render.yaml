services:
  - type: web
    name: confluencr-assessment
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerCommand: python -m app.render_start
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PROCESSING_DELAY_SECONDS
        value: "30"
      - key: PROCESSING_LEASE_SECONDS
        value: "120"
      - key: DISPATCH_STALE_SECONDS
        value: "120"
      - key: RECONCILE_INTERVAL_SECONDS
        value: "5"
      - key: WORKER_CONCURRENCY
        value: "5"
      - key: DATABASE_URL
        fromDatabase:
          name: confluencr-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: confluencr-kv
          property: connectionString

  - type: keyvalue
    name: confluencr-kv
    plan: free
    region: singapore
    ipAllowList: []
    maxmemoryPolicy: noeviction

databases:
  - name: confluencr-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"
