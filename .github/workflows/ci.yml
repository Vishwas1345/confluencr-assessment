name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: confluencr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d confluencr_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/confluencr_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/confluencr_test
      REDIS_URL: redis://localhost:6379/0
      PROCESSING_DELAY_SECONDS: "0.05"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Test
        run: pytest -q -m "not e2e and not slow"

      - name: Latency test
        run: pytest -m slow -q

  e2e:
    runs-on: ubuntu-latest
    needs: lint-and-test
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: confluencr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d confluencr_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/confluencr_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/confluencr_test
      REDIS_URL: redis://localhost:6379/0
      PROCESSING_DELAY_SECONDS: "0.05"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: End-to-end test
        run: pytest -m e2e -q
